# Ansible configuration — leonshomelab
#
# ---------------------------------------------------------------------------
# THIS FILE IS THE RECOVERY COPY, NOT THE OPERATIVE ONE.
#
# The live config is ~/.ansible.cfg inside WSL. Ansible deliberately IGNORES
# an ansible.cfg found in a world-writable directory, and /mnt/c is mounted
# world-writable by WSL — so a config living in this repo would be silently
# skipped, which is worse than not having one.
#
# To restore on a new control node:
#     cp ansible/ansible.cfg ~/.ansible.cfg
#
# Keep the two in sync by hand. If they diverge, this one is the intent.
# ---------------------------------------------------------------------------

[defaults]
inventory = /mnt/c/Users/leons/Documents/GitHub/leonshomelab/ansible/inventory.yml

# Left ON deliberately. The control node's known_hosts was seeded from the
# workstation's existing 19 entries, so host identity was already established
# and there was no reason to weaken verification for convenience.
host_key_checking = True

# OPNsense is FreeBSD with python3 at /usr/local/bin/python3, set per-host in
# the inventory. auto_silent suppresses the discovery warning on every task.
interpreter_python = auto_silent

retry_files_enabled = False
nocows = True

[ssh_connection]
# Fewer SSH round trips per task. Safe here: no host uses requiretty.
pipelining = True
